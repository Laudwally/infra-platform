# Pulls the RDS-managed master password (created by modules/rds via
# `manage_master_user_password = true`, never stored in Terraform state)
# out of AWS Secrets Manager and into a Kubernetes Secret, using the
# external-secrets service account's IRSA role rather than node credentials.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rds-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: rds-credentials
  dataFrom:
    # Replace with the actual secret ARN from `terraform output rds_master_user_secret_arn`.
    - extract:
        key: "infra-platform-dev-db-master-password"
